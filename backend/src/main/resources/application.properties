spring.application.name=traveltripped-backend

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/traveltripped}
spring.data.mongodb.database=${MONGODB_DB:traveltripped}

server.port=${SERVER_PORT:8080}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

spring.web.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

logging.level.com.traveltripped=DEBUG

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always