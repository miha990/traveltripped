---
# ConfigMap for backend
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: traveltripped
data:
  SERVER_PORT: "8080"
  MONGODB_DB: "traveltripped"
  JWT_EXPIRATION: "86400000"
  CORS_ORIGINS: "http://traveltripped.local,https://traveltripped.local"

---
# ConfigMap for MongoDB
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-config
  namespace: traveltripped
data:
  MONGO_INITDB_DATABASE: "traveltripped"
