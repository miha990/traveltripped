---
# ConfigMap for backend non-sensitive config
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: traveltripped
data:
  SERVER_PORT: "8080"
  MONGODB_DB: "traveltripped"
  JWT_EXPIRATION: "86400000"
  CORS_ORIGINS: "http://traveltripped.local,https://traveltripped.local"

---
# Secret for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: traveltripped
type: Opaque
stringData:
  MONGO_ROOT_PASSWORD: MONGO_ROOT_PASSWORD
  MONGO_ROOT_USER: MONGO_ROOT_USER
  JWT_SECRET: JWT_SECRET

---
# ConfigMap for MongoDB
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-config
  namespace: traveltripped
data:
  MONGO_INITDB_DATABASE: "traveltripped"
