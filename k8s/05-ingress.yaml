---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traveltripped-ingress
  namespace: traveltripped
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
  labels:
    app: traveltripped
spec:
  ingressClassName: nginx
  rules:
    - host: traveltripped.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
